<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 手机竖屏优先：宽度自适应，禁止放大缩小导致的诡异布局 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3ece2">
  <title>西迁行囊 · 三消小游戏</title>
  <!-- 相对路径引用，所以双击 index.html（file://）和放到静态托管上都能用 -->
  <link rel="stylesheet" href="style.css?v=2026-10-11-11">
</head>
<body>

  <!-- ============ 背景层：车厢照片 + 压暗 ============
       固定铺满整个视口（position: fixed），所以内容再多也不会把照片拉变形。
       两层分开写：photo 放照片，veil 放压暗渐变。
       都 pointer-events: none，不挡操作。 -->
  <div id="scene" aria-hidden="true">
    <div id="scenePhoto"></div>
    <div id="sceneVeil"></div>
  </div>

  <!-- ============ 氛围层：飘尘（JS 生成）============ -->
  <div id="atmos" aria-hidden="true"></div>

  <!-- ============ 页面主体：背景图 + 内容 都放在这一层里 ============
       这样背景可以用绝对定位铺满「内容区」，而不是铺满整个视口 ——
       车厢那种长透视图铺满整屏时，中间会被拉得很怪。 -->
  <div id="page">

  <!-- 顶部一行：左班徽 / 中标题 / 右图鉴按钮 -->
  <div id="topBar">
    <!-- 班级班徽（放 assets/class-badge.jpg；想换成别的图改 src 即可） -->
    <img id="classBadge" class="top-badge" src="assets/class-badge.jpg" alt="电气 2615 班徽" draggable="false">

    <h1 id="gameTitle" class="top-title">西迁行囊</h1>

    <button type="button" id="codexBtn" class="top-codex" title="西迁行囊图鉴">
      <span class="codex-btn-label">图鉴</span>
      <!-- 计数由 game.js 按 TILES.length 算好填进来，所以这里不写死 -->
      <span class="codex-btn-num" id="codexCount">0</span>
    </button>
  </div>

  <main id="app">
    <!-- 牌堆区，两层：
           #stage = 木质桌面（有内边距，四周露出木纹）
           #board = 牌的定位容器（和棋盘严格等大，牌都塞在这里面）
         牌是绝对定位的 DOM 节点，坐标按「格」算。 -->
    <div id="stage">
      <div id="board" aria-label="牌堆"></div>
    </div>

    <!-- 下方卡槽：按关卡配置的格子数（默认 7），按点击顺序从左往右排 -->
    <div id="slotsBar">
      <div id="slots" aria-label="卡槽"></div>
    </div>

    <!-- ============ 旅程进度条：上海 → 西安 ============
         每消掉一组牌，小火车往前挪一点；通关时鸣笛抵达。
         把「收集行李」变成「走完西迁路」，是主题沉浸感的主要来源。
         进度由 game.js 更新，这里只给结构。 -->
    <div id="journey" aria-label="西迁路程">
      <span class="journey-stop from">上海</span>
      <span class="journey-stop to">西安</span>
      <div id="journeyTrack"></div>
      <div id="journeyFill"></div>
      <div id="journeyTrain" aria-hidden="true">
        <!-- 一颗小火车头图标 -->
        <svg viewBox="0 0 44 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="11" width="17" height="12" rx="2" fill="#5a4a33"/>
          <rect x="5" y="14" width="5" height="5" rx="1" fill="#f3ece2"/>
          <rect x="12" y="14" width="5" height="5" rx="1" fill="#f3ece2"/>
          <rect x="21" y="9" width="16" height="14" rx="2" fill="#4a3d2a"/>
          <rect x="25" y="12" width="6" height="6" rx="1" fill="#f3ece2"/>
          <rect x="22" y="3" width="4" height="6" rx="1" fill="#4a3d2a"/>
          <circle cx="24" cy="2" r="2.4" fill="#5a4a33" opacity="0.6"/>
          <rect x="1" y="22" width="37" height="2.6" rx="1.2" fill="#4a3d2a"/>
          <circle cx="7" cy="26" r="3.2" fill="#4a3d2a"/>
          <circle cx="17" cy="26" r="3.2" fill="#4a3d2a"/>
          <circle cx="29" cy="26" r="3.6" fill="#4a3d2a"/>
          <circle cx="37" cy="26" r="2.6" fill="#4a3d2a"/>
          <!-- 车头冒的金色小火星，表示在往前走 -->
          <circle cx="26" cy="1" r="1.6" fill="#e8b23a" opacity="0.85"/>
        </svg>
      </div>
    </div>

    <!-- 牌堆和按钮之间的空隙：放一句主题小字 -->
    <div id="subtitle">
      <p class="subtitle-sub">把散落的行囊，一件件收好</p>
    </div>

    <!-- 底部按钮 -->
    <footer id="footer">
      <button type="button" id="restartBtn" class="btn">重新开始</button>
    </footer>
  </main>

  </div><!-- /#page -->

  <!-- ============ 消牌知识点提示条（自动消失，不挡操作） ============ -->
  <div id="tipbar" class="tipbar" aria-live="polite">
    <span class="tipbar-tag">西迁知识点</span>
    <span id="tipText"></span>
  </div>

  <!-- ============ 在微信 / QQ 里打开时的引导遮罩 ============
       现实：微信和 QQ 的内置浏览器【不允许】网页自动跳到外部浏览器（scheme 被拦），
       而且它们的菜单位置各家版本都不一样（QQ 的部分版本右上角就没有「···」），
       所以给「点某个按钮」的固定引导是不靠谱的。
       这里改成【复制链接 + 把链接显示出来】：
         ① 点「复制链接」→ 复制成功就提示，失败就把链接显示出来让用户长按复制；
         ② 链接始终显示在下面，用户也可以长按手动选。
       点过按钮、或点了「就在这儿玩」之后就不再弹（存在 sessionStorage）。 -->
  <div id="escapeOverlay" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card escape-card">
      <h2 id="escapeTitle">建议用浏览器打开</h2>
      <p id="escapeLead" class="escape-lead"></p>
      <p id="escapeHowto" class="escape-howto"></p>
      <p id="escapeUrl" class="escape-url" tabindex="0"></p>
      <p id="escapeHint" class="escape-hint"></p>
      <button type="button" id="escapeCopyBtn" class="btn btn-primary">复制链接</button>
      <button type="button" id="escapeSkipBtn" class="btn escape-skip">就在这儿玩</button>
    </div>
  </div>

  <!-- ============ 输 / 赢 / 答题复活 弹窗 ============ -->
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h2 id="modalTitle">提示</h2>
      <p id="modalHint"></p>

      <!-- 答题区：只有「答题复活」时才显示 -->
      <div id="quizBox" class="quiz-box" hidden>
        <p id="quizQuestion" class="quiz-question"></p>
        <div id="quizOptions" class="quiz-options"></div>
        <p id="quizResult" class="quiz-result"></p>
      </div>

      <button type="button" id="modalButton" class="btn btn-primary">再来一局</button>
    </div>
  </div>

  <!-- ============ 图鉴：全部物品（图片 + 名称 + 是否已解锁） ============ -->
  <!-- 用「右上角叉号」关闭，底部不放按钮；整页不可滚动（内容一屏放得下） -->
  <div id="codexModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card codex-card">
      <button type="button" id="codexCloseBtn" class="modal-close" aria-label="关闭图鉴">×</button>
      <h2>西迁行囊图鉴</h2>
      <p class="codex-sub" id="codexSub">消除 3 张相同物品，即可解锁它的故事</p>
      <div id="codexGrid" class="codex-grid"></div>
    </div>
  </div>

  <!-- ============ 单个物品详情：图片 + 知识点 + 详细介绍 ============ -->
  <div id="detailModal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-card detail-card">
      <button type="button" id="detailCloseBtn" class="modal-close" aria-label="关闭">×</button>
      <div id="detailPic" class="detail-pic"></div>
      <h2 id="detailTitle">物品</h2>
      <p id="detailKnowledge" class="detail-knowledge"></p>
      <p id="detailBody" class="detail-body"></p>
    </div>
  </div>

  <script src="tile-story.js?v=2026-10-11-11"></script>
  <script src="stats-config.js?v=2026-10-11-11"></script>
  <script src="stats.js?v=2026-10-11-11"></script>
  <script src="sfx.js?v=2026-10-11-11"></script>
  <script src="game.js?v=2026-10-11-11"></script>
  <!-- fx.js 放最后：它要在 game.js 定义完、页面元素都在之后再挂动效 -->
  <script src="fx.js?v=2026-10-11-11"></script>
</body>
</html>
